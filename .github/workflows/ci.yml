name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Typecheck, lint & test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        # npm ci installs exactly the checked-in lockfile and does not rewrite
        # it. The fallback covers the CLI's nested shrinkwrap on platforms
        # where an optional dependency is unavailable.
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Check
        run: npm run check
