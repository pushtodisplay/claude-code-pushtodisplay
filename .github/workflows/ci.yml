name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Typecheck, lint & test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        # The pushtodisplay CLI ships a nested shrinkwrap whose platform-
        # specific esbuild optional deps make `npm ci` fail on some runners.
        # `npm install` resolves the same lockfile without that check.
        run: npm install --no-audit --no-fund

      - name: Check
        run: npm run check
